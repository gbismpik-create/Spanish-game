<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#261d15">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Conquista">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Conquista: The New World</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="map"></canvas>

  <div id="game-ui" class="hidden">
    <div id="hud"></div>
    <div id="mode"></div>
    <div id="log"><div class="log-title">Ship's Log</div><div id="log-lines"></div></div>
    <canvas id="minimap" title="Click to look elsewhere"></canvas>
    <div id="actions">
      <button id="btn-land" title="Land an expedition / re-embark (L)"><span class="ico">🚣</span><span class="lbl">Land</span></button>
      <button id="btn-forage" title="Spend five days hunting and gathering (F)"><span class="ico">🌿</span><span class="lbl">Forage</span></button>
      <button id="btn-careen" title="Beach the ship to repair her (20 days)"><span class="ico">🔧</span><span class="lbl">Careen</span></button>
      <button id="btn-center" title="Centre on your expedition (Space)"><span class="ico">🎯</span></button>
      <button id="btn-codex" title="Artifacts"><span class="ico">📜</span><span class="lbl">Codex</span></button>
      <button id="btn-zin" class="sec desk" title="Zoom in"><span class="ico">＋</span></button>
      <button id="btn-zout" class="sec desk" title="Zoom out"><span class="ico">－</span></button>
      <button id="btn-disc" class="sec" title="Discoveries and peoples"><span class="ico">🧭</span><span class="lbl">Atlas</span></button>
      <button id="btn-log" class="sec" title="Show/hide the log"><span class="ico">📖</span><span class="lbl">Log</span></button>
      <button id="btn-mini" class="sec" title="Show/hide the minimap"><span class="ico">🗺️</span><span class="lbl">Map</span></button>
      <button id="btn-save" class="sec" title="Save game"><span class="ico">💾</span><span class="lbl">Save</span></button>
      <button id="btn-sound" class="sec" title="Sound settings"><span class="ico">🔊</span><span class="lbl">Sound</span></button>
      <button id="btn-help" class="sec" title="How to play"><span class="ico">❓</span><span class="lbl">Help</span></button>
      <button id="btn-more" title="More"><span class="ico">⋯</span></button>
    </div>
    <div id="banner"></div>
    <div id="toasts"></div>
  </div>

  <div id="tooltip"></div>

  <div id="title-screen">
    <div class="title-box">
      <div class="title-cross">✠</div>
      <h1>Conquista</h1>
      <h2>The New World · 1492–1600</h2>
      <p class="intro">Sail west from Sevilla across the Ocean Sea. Discover unknown coasts and islands, meet the peoples of the Americas, fight or ally with them, uncover the treasures of ancient ruins — and see the terrible cost of conquest.</p>
      <div id="loading">Charting the New World…</div>
      <div id="title-menu" class="hidden">
        <label>Your name, Captain: <input id="captain" maxlength="24" placeholder="Rodrigo de Triana"></label>
        <div class="title-buttons">
          <button id="btn-new">⚓ New Expedition</button>
          <button id="btn-continue">📜 Continue</button>
          <button id="btn-howto">❓ How to play</button>
          <button id="btn-install" class="hidden">📲 Install app</button>
        </div>
        <p id="install-hint" class="hidden"></p>
      </div>
    </div>
  </div>

  <div id="modal-bg"><div id="modal"></div></div>

  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/raids.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
